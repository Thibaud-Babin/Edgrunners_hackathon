# Builds the Windows installer and portable exe on a Windows machine (the team codes on macOS too).
# Download: GitHub → Actions → this run → Artifacts → Tap-Windows. No secrets are used: keys stay on the user's PC.
name: Windows build

on:
  push:
    branches: [feat/windows-distribution]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      # postinstall copies the MediaPipe wasm and downloads the face model; npm also installs sherpa-onnx-win-x64
      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # unsigned build

      - uses: actions/upload-artifact@v4
        with:
          name: Tap-Windows
          path: |
            app/dist/Tap-Setup-*.exe
            app/dist/Tap-Portable-*.exe
          if-no-files-found: error
