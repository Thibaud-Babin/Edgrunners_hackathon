<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { font: 13px system-ui, sans-serif; width: 280px; margin: 12px; color: #1f1f1f; }
      h1 { font-size: 14px; margin: 0 0 6px; }
      .st { margin: 0 0 8px; color: #555; }
      .ok { color: #137333; }
      .bad { color: #b3261e; }
      ul { list-style: none; padding: 0; margin: 0; }
      li { padding: 3px 0; display: flex; justify-content: space-between; }
      .talk { color: #1a73e8; font-weight: 600; }
      .note { margin-top: 10px; font-size: 11px; color: #777; }
    </style>
  </head>
  <body>
    <h1>Tap: Meet names</h1>
    <p class="st" id="st">Open a Google Meet call…</p>
    <ul id="people"></ul>
    <p class="note">Only names and who is speaking, sent to Tap on this laptop. Never your audio or video.</p>
    <script src="popup.js"></script>
  </body>
</html>
