    <linearGradient id="orbit-stroke" x1="12" y1="8" x2="52" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F7FCFF"/>
      <stop offset="1" stop-color="#B9F4FF"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="108" fill="#0b0f17"/>
  <g transform="translate(64 64) scale(6)" fill="none">
    <g stroke="url(#orbit-stroke)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="32" cy="32" rx="12.5" ry="24"/>
      <ellipse cx="32" cy="32" rx="12.5" ry="24" transform="rotate(60 32 32)"/>
      <ellipse cx="32" cy="32" rx="12.5" ry="24" transform="rotate(-60 32 32)"/>
      <circle cx="32" cy="8" r="3.1" fill="#F7FCFF"/>
      <circle cx="11.2" cy="44" r="3.1" fill="#E8FAFF"/>
